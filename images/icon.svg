<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#251a3f"/>
      <stop offset="100%" stop-color="#130c22"/>
    </linearGradient>
    <linearGradient id="quill" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- git branch trail: single stem forking into a commit dot and a branch ring -->
  <path d="M 45 88 C 41 95, 40 100, 40 104" fill="none" stroke="#A78BFA" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 40 104 C 33 108, 27 110, 22 112" fill="none" stroke="#A78BFA" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 40 104 C 46 109, 50 112, 52 116" fill="none" stroke="#A78BFA" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="22" cy="112" r="6.5" fill="#C4B5FD"/>
  <circle cx="52" cy="116" r="6.5" fill="#130c22" stroke="#C4B5FD" stroke-width="4"/>
  <circle cx="40" cy="104" r="4.5" fill="#C4B5FD"/>

  <!-- quill feather body: tapered stroke from tip (bottom-left) to flared top (upper-right) -->
  <path d="M 45 88
           C 40 72, 47 52, 62 36
           C 73 25, 86 18, 98 14
           C 92 25, 85 34, 80 43
           C 69 60, 56 75, 48 92
           Z"
        fill="url(#quill)"/>

  <!-- spine highlight down the middle of the feather -->
  <path d="M 94 18 C 77 29, 60 50, 47 86" fill="none" stroke="#F5F3FF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>
